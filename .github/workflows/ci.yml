name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Test + catalog drift
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Regenerate catalog
        run: npm run catalog:gen

      - name: Fail on generated drift
        run: git diff --exit-code -- src/data/samCatalog.generated.ts public/catalog/v1.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
